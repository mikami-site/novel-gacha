<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>特別小説</title>

  <link rel="stylesheet"
        href="css/style.css">
</head>


<body>

  <!-- ==========================
       年齢確認画面
  =========================== -->

  <div id="age-gate" class="age-gate">

    <div class="age-gate-box">

      <h1>年齢確認</h1>

      <p>
        この先には成人向けの内容が含まれます。
      </p>

      <p>
        18歳未満の方は閲覧をご遠慮ください。
      </p>


      <button id="age-confirm"
              class="gacha-button">
        18歳以上です
      </button>


      <button id="age-decline"
              class="age-decline">
        18歳未満です
      </button>

    </div>

  </div>


  <!-- ==========================
       小説本文
  =========================== -->

  <main id="special-content"
        class="container special-hidden">

    <article class="story">

      <header class="story-header">

        <h1>
          特別小説タイトル
        </h1>

        <p class="story-page">
          1 / 2
        </p>

      </header>


      <section class="story-body">

        <p>
          　ここに一ページ目の本文を入れます。
        </p>

        <p>
          「会話文です」
        </p>

        <p>
          　本文の続きです。
        </p>

        <p>
          　さらに本文が続きます。
        </p>

      </section>


      <nav class="story-navigation">

        <a href="special2.html"
           class="page-button">
          次のページへ →
        </a>

      </nav>

    </article>

  </main>


  <script src="js/special.js"></script>

</body>

</html>

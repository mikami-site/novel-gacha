<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>悠アキSSガチャ</title>

  <link rel="stylesheet"
        href="css/style.css">
</head>


<body class="index-page">

  <main class="container">

    <!-- ==========================
         サイトタイトル
    =========================== -->

    <header class="site-header">

      <h1>
        悠アキSSガチャ
      </h1>

      <p class="description">
        ボタンを押すと、ランダムで1作品が表示されます。<br>
        テーマは「四季」<br>
        二人が過ごす様々な季節を味わってください
      </p>

    </header>


    <!-- ==========================
         ガチャ
    =========================== -->

    <section class="gacha-area">

      <button id="gacha-button"
              class="gacha-button">

        ガチャを引く

      </button>

      <p class="count">
        全14種
      </p>

    </section>


    <!-- ==========================
         書き手一覧
    =========================== -->

    <section class="writers-section">

      <h2 class="writers-title">
        WRITERS　※敬称略
      </h2>

      <div id="writers-list"
           class="writers-list">
      </div>

    </section>

  </main>


  <!-- 作者・作品データ -->
  <script src="js/data.js"></script>

  <!-- ガチャ・書き手一覧表示 -->
  <script src="js/gacha.js"></script>

</body>

</html>

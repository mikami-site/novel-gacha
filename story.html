<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SSガチャ</title>

  <link rel="stylesheet"
        href="css/style.css">
</head>


<body>

  <main class="container">

    <article class="story">

      <header class="story-header">

        <h1 id="story-title"></h1>


        <dl class="story-info">

          <div>
            <dt>Theme</dt>
            <dd id="story-theme"></dd>
          </div>

          <div>
            <dt>Writer</dt>

            <dd>
              <a id="story-author"
                 href=""
                 target="_blank"
                 rel="noopener noreferrer">
              </a>
            </dd>

          </div>

        </dl>

      </header>


      <section
        id="story-body"
        class="story-body">
      </section>


      <footer class="story-footer">

        <button
          id="retry-button"
          class="gacha-button">

          もう一度引く

        </button>

      </footer>

    </article>

  </main>


  <script src="js/data.js"></script>
  <script src="js/story.js"></script>

</body>

</html>

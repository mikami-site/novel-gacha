<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SSガチャ</title>

  <link rel="stylesheet"
        href="css/style.css">
</head>


<body class="story-page-body">


  <!-- ========================================
       上部固定ヘッダー
  ========================================= -->

  <header class="fixed-story-header">

    <div class="fixed-story-header-inner">

      <!-- トップへ戻る -->
      <div class="fixed-header-top">

        <a href="index.html"
           class="back-home-button">
          ← トップに戻る
        </a>

      </div>


      <!-- 作品タイトル -->
      <h1 id="story-title"
          class="fixed-story-title">
      </h1>


      <!-- 作品情報 -->
      <div class="fixed-story-meta">

        <!-- テーマ -->
        <div class="meta-item">

          <span class="meta-label">
            Theme
          </span>

          <span id="story-theme"
                class="meta-value">
          </span>

        </div>


        <!-- 書き手 -->
        <div class="meta-item">

          <span class="meta-label">
            Writer
          </span>

          <span id="story-author"
                class="meta-value">
          </span>

        </div>


        <!-- SNS -->
        <div class="meta-item">

          <span class="meta-label">
            SNS
          </span>

          <span id="story-sns"
                class="story-sns">
          </span>

        </div>

      </div>

    </div>

  </header>



  <!-- ========================================
       小説本文
  ========================================= -->

  <main class="container story-main">

    <article class="story">

      <section id="story-body"
               class="story-body">
      </section>



      <!-- ========================================
           下部ボタン
      ========================================= -->

      <footer class="story-footer">

        <button id="retry-button"
                class="gacha-button">
          もう一度引く
        </button>


        <a href="index.html"
           class="bottom-home-link">
          トップに戻る
        </a>

      </footer>

    </article>

  </main>



  <!-- data.jsを先に読み込む -->
  <script src="js/data.js"></script>

  <!-- story.jsを後に読み込む -->
  <script src="js/story.js"></script>

</body>

</html>
